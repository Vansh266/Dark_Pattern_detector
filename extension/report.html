<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Manipulation Risk Report</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 16px; color: #222; }
    .url { color: #666; font-size: 13px; word-break: break-all; }
    .scorebox { display: flex; align-items: baseline; gap: 16px; margin: 20px 0 8px; }
    .score { font-size: 56px; font-weight: bold; }
    .band { font-size: 22px; font-weight: bold; }
    .band-nonedetected .band { color: #2e7d32; }
    .band-low .band { color: #f9a825; }
    .band-moderate .band { color: #ef6c00; }
    .band-high .band { color: #d84315; }
    .band-severe .band { color: #b71c1c; }
    .bar { background: #eee; height: 12px; border-radius: 6px; overflow: hidden; }
    .fill { background: linear-gradient(90deg, #f9a825, #d32f2f); height: 100%; }
    .summary { margin: 14px 0 24px; line-height: 1.5; }
    .card { border: 1px solid #ddd; border-left: 6px solid #999; border-radius: 6px; padding: 4px 16px; margin: 14px 0; }
    .card.sev-low { border-left-color: #f9a825; }
    .card.sev-medium { border-left-color: #ef6c00; }
    .card.sev-high { border-left-color: #d32f2f; }
    .advice { background: #f1f8e9; padding: 8px 10px; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th { background: #f6f6f6; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="report.js"></script>
</body>
</html>
